# ========================================
# 품목갱신 알림 자동화(RPA) 설정
# ========================================

# --- 데이터 파일 경로 ---
data:
  medicine_csv: "data/의약품갱신일정.csv"
  device_csv: "data/의료기기갱신일정.csv"

# --- 발송 이력 로그 ---
log:
  send_history: "logs/send_history.csv"

# --- 메일 수신자 ---
recipients:
  to:
    - "jisoo.kim@samyang.com"
    - "gyeonghwan.kim@samyang.com"
    - "taeyeon.jang@samyang.com"
  cc: []
  bcc: []

# --- SMTP 설정 ---
smtp:
  host: "smtp.gmail.com"
  port: 587
  use_tls: true
  sender: "popice76@gmail.com"
  # 비밀번호는 환경변수: SMTP_PASSWORD

# --- 재시도 설정 ---
retry:
  max_attempts: 3
  backoff_seconds: [1, 3, 9]

# --- 운영자 알림 (발송 실패 시) ---
operator_alert:
  enabled: true
  email: "admin@example.com"

# --- 엑셀 업데이트 ---
excel_update:
  enabled: false
  border_color: "FF0000"
  border_style: "thin"
